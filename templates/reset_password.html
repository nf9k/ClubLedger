{% extends "base.html" %}

{% block title %}Reset Password - {{ org_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    {% if logo_filename %}
                    <img src="{{ url_for('static', filename=logo_filename) }}" alt="{{ org_name }}" style="max-width: 300px; height: auto;">
                    {% else %}
                    <h4 class="mb-0"><i class="bi bi-broadcast"></i> {{ org_name }}</h4>
                    {% endif %}
                    <h5 class="mt-3"><i class="bi bi-key"></i> Set New Password</h5>
                </div>

                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label for="new_password" class="form-label">New Password</label>
                        <input type="password" class="form-control" id="new_password" name="new_password" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> Reset Password
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
